<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kasino Web</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
      /* The app handles all input itself: no text selection, no long-press
         callout, no tap highlight. */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: grid;
      place-items: center;
    }

    #stage {
      position: relative;
      aspect-ratio: 1080 / 1920;
      width: min(100vw, calc(100dvh * 1080 / 1920));
      height: min(100dvh, calc(100vw * 1920 / 1080));
      max-width: 100vw;
      max-height: 100dvh;
      background: black;
      overflow: hidden;
    }

    @supports not (height: 100dvh) {
      #stage {
        width: min(100vw, calc(100vh * 1080 / 1920));
        height: min(100vh, calc(100vw * 1920 / 1080));
        max-width: 100vw;
        max-height: 100vh;
      }
    }

    #canvas {
      display: block;
      /* !important beats the inline style SDL's emscripten driver writes on
         the canvas when SDL_WINDOW_HIGH_PIXEL_DENSITY scales the backing size. */
      width: 100% !important;
      height: 100% !important;
      background: black;
      touch-action: none;
    }

    #loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: black;
      color: white;
      font-family: sans-serif;
      z-index: 10;
    }

    #loading.hidden {
      display: none;
    }

    #loading-inner {
      width: min(72%, 420px);
      text-align: center;
    }

    #loading-text {
      margin-bottom: 14px;
      font-size: 16px;
      line-height: 1.4;
      opacity: 0.95;
    }

    #loading-bar-wrap {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      overflow: hidden;
    }

    #loading-bar-fill {
      width: 0%;
      height: 100%;
      background: rgba(255, 255, 255, 0.92);
      transform-origin: left center;
    }

    #loading-detail {
      margin-top: 10px;
      font-size: 13px;
      opacity: 0.72;
      min-height: 1.2em;
    }

  </style>
</head>

<body>
  <div id="stage">
    <canvas
      id="canvas"
      width="1080"
      height="1920"
      oncontextmenu="event.preventDefault()"></canvas>

    <!-- Hidden input: SDL's emscripten driver has no on-screen keyboard
         support, so mobile browsers type through this element instead. -->
    <input id="ti" type="text"
      autocomplete="off" autocorrect="off" autocapitalize="off"
      spellcheck="false" enterkeyhint="done"
      style="position: fixed; top: 0; left: 0; width: 2px; height: 2px;
             opacity: 0.01; border: 0; padding: 0; background: transparent;
             color: transparent; caret-color: transparent; z-index: 30;">

    <div id="loading">
      <div id="loading-inner">
        <div id="loading-text">Loading…</div>
        <div id="loading-bar-wrap">
          <div id="loading-bar-fill"></div>
        </div>
        <div id="loading-detail"></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const WASM_NAME = "kasino.2cf1054.wasm";

      const sdlCanvas = document.getElementById("canvas");

      // --- Mobile text input bridge ---------------------------------------
      // The app arms window.kasinoWantsKeyboard when a text field is active.
      // iOS only opens the on-screen keyboard from a user gesture, so we
      // focus the hidden input from pointerup handlers as well.
      const ti = document.getElementById("ti");
      window.kasinoWantsKeyboard = false;

      function callApp(name, argTypes, args) {
        if (window.Module && typeof Module.ccall === "function") {
          try { Module.ccall(name, null, argTypes, args); } catch (e) {}
        }
      }

      ti.addEventListener("input", (e) => {
        if (e.inputType === "deleteContentBackward") {
          callApp("kasinoWebBackspace", [], []);
        } else if (e.inputType === "insertLineBreak") {
          callApp("kasinoWebSubmit", [], []);
        } else if (e.data) {
          callApp("kasinoWebTextInput", ["string"], [e.data]);
        } else if (ti.value) {
          // Autocorrect/swipe insertions arrive without e.data.
          callApp("kasinoWebTextInput", ["string"], [ti.value]);
        }
        ti.value = "";
      });

      ti.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          callApp("kasinoWebSubmit", [], []);
        }
      });

      // iOS Safari only opens the keyboard when focus() runs inside a
      // qualifying user gesture — touchend is the reliable one (click never
      // fires on the canvas because SDL preventDefaults touch events).
      function focusIfWanted() {
        if (window.kasinoWantsKeyboard && document.activeElement !== ti) {
          ti.focus({ preventScroll: true });
        }
      }
      document.addEventListener("touchend", focusIfWanted);
      document.addEventListener("pointerup", focusIfWanted);
      document.addEventListener("click", focusIfWanted);

      // --- Relay transport bridge -----------------------------------------
      // The C side (net.c) drives these; WebSocket events flow back through
      // the kasinoNet* wasm exports. Everything is WebSocket (hosting too),
      // and the room code arrives in the roster messages.
      const RELAY_URL = "wss://kasino-relay.thj-c83.workers.dev";
      let relayWs = null;

      function relayConnect(path) {
        const ws = new WebSocket(RELAY_URL + path);
        relayWs = ws;
        ws.onopen = () => callApp("kasinoNetOpen", [], []);
        ws.onmessage = (e) => callApp("kasinoNetMessage", ["string"], [String(e.data)]);
        ws.onerror = () => callApp("kasinoNetError", ["string"], ["connection failed"]);
        ws.onclose = () => callApp("kasinoNetClosed", [], []);
      }

      window.kasinoNetHost = function (max, teams, name) {
        relayConnect("/host?max=" + max + "&teams=" + (teams ? 1 : 0) +
                     "&name=" + encodeURIComponent(name));
      };

      window.kasinoNetJoin = function (code, name) {
        relayConnect("/join/" + code + "?name=" + encodeURIComponent(name));
      };

      window.kasinoNetSend = function (data) {
        if (relayWs && relayWs.readyState === 1) relayWs.send(data);
      };

      window.kasinoNetLeave = function () {
        if (relayWs) { relayWs.onclose = null; relayWs.close(); relayWs = null; }
      };

      const loadingEl = document.getElementById("loading");
      const loadingTextEl = document.getElementById("loading-text");
      const loadingBarFillEl = document.getElementById("loading-bar-fill");
      const loadingDetailEl = document.getElementById("loading-detail");

      let runtimeReady = false;
      let fakePercent = 0;
      let realPercent = 0;
      let targetPercent = 0;
      let rafId = 0;
      let dependenciesTotal = 0;

      function setLoadingText(text) {
        loadingTextEl.textContent = text || "Loading…";
      }

      function setLoadingDetail(text) {
        loadingDetailEl.textContent = text || "";
      }

      function setBarPercent(percent) {
        const clamped = Math.max(0, Math.min(100, percent));
        loadingBarFillEl.style.width = clamped.toFixed(1) + "%";
      }

      function easeTowards(current, target) {
        const diff = target - current;
        if (Math.abs(diff) < 0.08) return target;
        return current + diff * 0.08;
      }

      function tickProgress() {
        if (!runtimeReady) {
          const ceiling = 90;
          const desired = Math.max(realPercent, Math.min(ceiling, targetPercent));

          fakePercent = easeTowards(fakePercent, desired);

          if (fakePercent < ceiling) fakePercent += 0.18;
          if (fakePercent > ceiling) fakePercent = ceiling;

          setBarPercent(fakePercent);

          if (dependenciesTotal > 0) {
            setLoadingText(`Loading… ${Math.round(fakePercent)}%`);
          } else {
            setLoadingText("Loading…");
          }

          rafId = requestAnimationFrame(tickProgress);
          return;
        }

        // Runtime is ready: hide immediately, no cosmetic easing.
        setBarPercent(100);
        loadingEl.classList.add("hidden");
      }

      function ensureProgressLoop() {
        if (!rafId) {
          rafId = requestAnimationFrame(tickProgress);
        }
      }

      ensureProgressLoop();

      var Module = {
        canvas: sdlCanvas,

        locateFile: function(path, prefix) {
          if (path.endsWith(".wasm")) {
            return prefix + WASM_NAME;
          }
          return prefix + path;
        },

        setStatus: function(text) {
          if (!text) return;

          const match = text.match(/\((\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)\)/);
          if (match) {
            const current = parseFloat(match[1]);
            const total = parseFloat(match[2]);
            if (total > 0) {
              realPercent = Math.max(realPercent, Math.round((current / total) * 100));
              targetPercent = realPercent;
            }
          }

          if (!runtimeReady) {
            setLoadingDetail(text.replace(/\s*\(\d+(?:\.\d+)?\/\d+(?:\.\d+)?\)\s*/, ""));
          }
        },

        monitorRunDependencies: (function () {
          let maxDependencies = 0;

          return function (left) {
            maxDependencies = Math.max(maxDependencies, left);
            dependenciesTotal = maxDependencies;

            if (maxDependencies > 0) {
              const done = maxDependencies - left;
              const percent = Math.round((done / maxDependencies) * 100);

              realPercent = Math.max(realPercent, percent);
              targetPercent = left === 0 ? 90 : Math.max(targetPercent, percent);

              if (left > 0) {
                setLoadingDetail(`Starting app (${done}/${maxDependencies})`);
              } else {
                setLoadingDetail("Finalizing startup…");
              }
            }
          };
        })(),

        onRuntimeInitialized: function() {
          runtimeReady = true;
          targetPercent = 100;
          realPercent = 100;
          setLoadingDetail("");

          console.log("SDL/WASM runtime ready");
        },

        onAbort: function(reason) {
          cancelAnimationFrame(rafId);
          rafId = 0;
          setBarPercent(fakePercent);
          setLoadingText("Could not start app");
          setLoadingDetail(String(reason || "Unknown error"));
          console.error("Abort:", reason);
        },

        print: function(text) {
          console.log(text);
        },

        printErr: function(text) {
          console.error(text);
        }
      };

      window.Module = Module;
    })();
  </script>

  <script async type="text/javascript" src="kasino.2cf1054.js"></script>
</body>
</html>
